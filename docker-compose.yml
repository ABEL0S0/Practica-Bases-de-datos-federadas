version: "3.9"

services:
  pg_federator:
    image: postgres:16
    container_name: pg_federator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: globaldb
    ports:
      - "5433:5432"
    volumes:
      - ./init/federator:/docker-entrypoint-initdb.d
    depends_on:
      - pg_source
      - pg_source2

  pg_source:
    image: postgres:16
    container_name: pg_source
    environment:
      POSTGRES_USER: srcuser
      POSTGRES_PASSWORD: srcpass
      POSTGRES_DB: ventas_pg
    ports:
      - "5434:5432"
    volumes:
      - ./init/pg:/docker-entrypoint-initdb.d

  pg_source2:
    image: postgres:16
    container_name: pg_source2
    environment:
      POSTGRES_USER: srcuser2
      POSTGRES_PASSWORD: srcpass2
      POSTGRES_DB: ventas_pg2
    ports:
      - "5435:5432"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d

